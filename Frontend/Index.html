<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Generative</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header Berwarna-warni -->
        <h1 class="rainbow-text">AI SMARTH GENERATIV</h1>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Halo! Aku AI Smart Generative. Ada yang bisa kubantu hari ini?</div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ketik pesan (maks 1000 kata)..." maxlength="5000">
            <input type="file" id="fileInput" accept="image/*,audio/*" style="display:none;">
            <button class="btn" onclick="document.getElementById('fileInput').click()">📁 File</button>
            <button class="btn send-btn" id="sendBtn">Kirim</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
